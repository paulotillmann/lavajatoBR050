<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LavajatoBR050 - Gestão Financeira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: {
                DEFAULT: "hsl(var(--primary))",
                foreground: "hsl(var(--primary-foreground))",
              },
              secondary: {
                DEFAULT: "hsl(var(--secondary))",
                foreground: "hsl(var(--secondary-foreground))",
              },
              destructive: {
                DEFAULT: "hsl(var(--destructive))",
                foreground: "hsl(var(--destructive-foreground))",
              },
              muted: {
                DEFAULT: "hsl(var(--muted))",
                foreground: "hsl(var(--muted-foreground))",
              },
              accent: {
                DEFAULT: "hsl(var(--accent))",
                foreground: "hsl(var(--accent-foreground))",
              },
              popover: {
                DEFAULT: "hsl(var(--popover))",
                foreground: "hsl(var(--popover-foreground))",
              },
              card: {
                DEFAULT: "hsl(var(--card))",
                foreground: "hsl(var(--card-foreground))",
              },
              palette: {
                light: "rgba(var(--palette-light), <alpha-value>)",
                medium: "rgba(var(--palette-medium), <alpha-value>)",
                dark: "rgba(var(--palette-dark), <alpha-value>)",
                deep: "rgba(var(--palette-deep), <alpha-value>)",
              }
            },
            borderRadius: {
              lg: "var(--radius)",
              md: "calc(var(--radius) - 2px)",
              sm: "calc(var(--radius) - 4px)",
            },
          },
        },
        plugins: [
          function({ addVariant }) {
            addVariant('light-theme', '.light-theme &')
          }
        ]
      }
    </script>
    <style>
      :root {
        --background: 222.2 47.4% 11.2%; /* #0f172a (Slate 900) */
        --foreground: 210 40% 98%; /* #f8fafc */
        --card: 217.2 32.6% 17.5%; /* #1e293b (Slate 800) */
        --card-foreground: 210 40% 98%;
        --popover: 222.2 47.4% 11.2%;
        --popover-foreground: 210 40% 98%;
        --primary: 221.2 83.2% 53.3%; /* #2563eb (Blue 600) */
        --primary-foreground: 210 40% 98%;
        --secondary: 217.2 32.6% 17.5%;
        --secondary-foreground: 210 40% 98%;
        --muted: 217.2 32.6% 17.5%;
        --muted-foreground: 215.4 16.3% 56.9%; /* #94a3b8 (Slate 400) */
        --accent: 217.2 32.6% 17.5%;
        --accent-foreground: 210 40% 98%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 210 40% 98%;
        --border: 215 27.9% 16.9%; /* #1e293b / border-slate-800 */
        --input: 217.2 32.6% 17.5%;
        --ring: 221.2 83.2% 53.3%;
        --radius: 0.75rem;

        /* Raw RGB channels for Tailwind opacity modifiers */
        --palette-deep: 15, 23, 42;       /* #0f172a */
        --palette-dark: 30, 41, 59;       /* #1e293b */
        --palette-medium: 59, 130, 246;    /* #3b82f6 */
        --palette-light: 241, 245, 249;   /* #f1f5f9 */

        --scrollbar-track: #0f172a;
        --scrollbar-thumb: #1e293b;
        --scrollbar-thumb-hover: #3b82f6;
      }
      
      .light-theme {
        --background: 210 40% 98%; /* #f8fafc */
        --foreground: 222.2 84% 4.9%; /* #0f172a */
        --card: 0 0% 100%; /* #ffffff */
        --card-foreground: 222.2 84% 4.9%;
        --primary: 221.2 83.2% 53.3%; /* #2563eb */
        --primary-foreground: 210 40% 98%;
        --border: 214.3 31.8% 91.4%; /* #e2e8f0 (Slate 200) */
        --input: 210 40% 98%;
        --ring: 221.2 83.2% 53.3%;

        /* Raw RGB channels for Tailwind opacity modifiers */
        --palette-deep: 248, 250, 252;    /* #f8fafc */
        --palette-dark: 255, 255, 255;    /* #ffffff */
        --palette-medium: 37, 99, 235;    /* #2563eb */
        --palette-light: 15, 23, 42;       /* #0f172a */

        --scrollbar-track: #f8fafc;
        --scrollbar-thumb: #cbd5e1;
        --scrollbar-thumb-hover: #2563eb;
      }

      body {
        background-color: rgba(var(--palette-deep), 1) !important;
        color: rgba(var(--palette-light), 1) !important;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }
      
      /* Transition all elements for rich visual aesthetic */
      div, header, main, section, button, input, select, textarea {
        transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), color 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Global input, select, and textarea focus styles only in light mode (white background and brand blue border) */
      .light-theme input:focus, .light-theme select:focus, .light-theme textarea:focus {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #3b82f6 !important;
        box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2) !important;
        outline: none !important;
      }

      /* Legible placeholder color when inputs are focused on white background in light mode */
      .light-theme input:focus::placeholder, .light-theme textarea:focus::placeholder {
        color: #94a3b8 !important;
      }

      /* Global primary buttons in light mode (excluding sidebar): matches the light mode menu area background (#18224f) */
      .light-theme button.bg-gradient-to-r:not(aside *),
      .light-theme button.bg-gradient-to-tr:not(aside *),
      .light-theme button[class*="bg-violet-"]:not(aside *),
      .light-theme button[class*="bg-indigo-"]:not(aside *),
      .light-theme button[class*="bg-cyan-"]:not(aside *),
      .light-theme button[class*="bg-blue-"]:not(aside *),
      .light-theme button[class*="bg-purple-"]:not(aside *) {
        background-image: none !important;
        background-color: #18224f !important;
        color: #ffffff !important;
        border-color: #18224f !important;
      }

      .light-theme button.bg-gradient-to-r:hover:not(aside *),
      .light-theme button.bg-gradient-to-tr:hover:not(aside *),
      .light-theme button[class*="bg-violet-"]:hover:not(aside *),
      .light-theme button[class*="bg-indigo-"]:hover:not(aside *),
      .light-theme button[class*="bg-cyan-"]:hover:not(aside *),
      .light-theme button[class*="bg-blue-"]:hover:not(aside *),
      .light-theme button[class*="bg-purple-"]:hover:not(aside *) {
        background-image: none !important;
        background-color: #222f6d !important;
        border-color: #222f6d !important;
      }

      /* Global primary buttons in dark mode (excluding sidebar): matches the dark mode menu area background (#0e111a) */
      body:not(.light-theme) button.bg-gradient-to-r:not(aside *),
      body:not(.light-theme) button.bg-gradient-to-tr:not(aside *),
      body:not(.light-theme) button[class*="bg-violet-"]:not(aside *),
      body:not(.light-theme) button[class*="bg-indigo-"]:not(aside *),
      body:not(.light-theme) button[class*="bg-cyan-"]:not(aside *),
      body:not(.light-theme) button[class*="bg-blue-"]:not(aside *),
      body:not(.light-theme) button[class*="bg-purple-"]:not(aside *) {
        background-image: none !important;
        background-color: #0e111a !important;
        color: #ffffff !important;
        border: 1px solid #1f2433 !important;
      }

      body:not(.light-theme) button.bg-gradient-to-r:hover:not(aside *),
      body:not(.light-theme) button.bg-gradient-to-tr:hover:not(aside *),
      body:not(.light-theme) button[class*="bg-violet-"]:hover:not(aside *),
      body:not(.light-theme) button[class*="bg-indigo-"]:hover:not(aside *),
      body:not(.light-theme) button[class*="bg-cyan-"]:hover:not(aside *),
      body:not(.light-theme) button[class*="bg-blue-"]:hover:not(aside *),
      body:not(.light-theme) button[class*="bg-purple-"]:hover:not(aside *) {
        background-image: none !important;
        background-color: #151926 !important;
        border-color: #3b82f6 !important;
      }
      
      /* Custom scrollbar matching palette */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb {
        background: var(--scrollbar-thumb);
        border-radius: 4px;
        border: 2px solid var(--scrollbar-track);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--scrollbar-thumb-hover);
      }

      /* Ultra discrete and thin scrollbar for specific containers like Sidebar and grids */
      .custom-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: rgba(148, 163, 184, 0.2) transparent;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
        height: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.2);
        border-radius: 9999px;
        border: none;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.4);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
